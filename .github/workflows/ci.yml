name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @savetab/extension exec playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest
      - run: pnpm test
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:e2e
      - run: pnpm test:e2e:firefox
      - name: Production builds hold no test hook
        run: pnpm build && ! grep -rq savetabTest apps/extension/.output/chrome-mv3 apps/extension/.output/firefox-mv3
