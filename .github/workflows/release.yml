name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Makes the release commit and the tag v<version> when a commit since the last tag calls for one.
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch head, since a run that waited in the group starts behind the last release commit.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: pipx install python-semantic-release==10.7.0
      # The GitHub Release is made by the publish job, with the assets.
      - id: version
        run: semantic-release -c releaserc.toml version --no-changelog --no-vcs-release
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - id: package
        run: node scripts/package-release.mjs
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # An unsigned release is a prerelease, so releases/latest/download/updates.json
      # keeps pointing at the last signed xpi.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          DIR: ${{ steps.package.outputs.dir }}
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          assets=("$DIR"/savetab-*)
          flags=()
          if [ "$SIGNED" = true ]; then
            assets+=("$DIR/updates.json")
          else
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$DIR/notes.md" --generate-notes "${flags[@]}" "${assets[@]}"

  # The sync server as ghcr.io/kocean33/savetab:<version>. GitHub-hosted: the lab runs
  # no self-hosted runner. homelab-workloads savetab/envs/prod.yaml names the tag to deploy.
  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      # The release commit, which github.sha does not name.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kocean33/savetab
          flavor: latest=false
          tags: type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
          labels: org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/server
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            COMMIT=${{ steps.commit.outputs.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
