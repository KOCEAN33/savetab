{{- /*
group, kind, weight and the catch-all match are Gateway API defaults, spelled
out because the API server writes them and Argo CD's client-side diff does not
know they are defaults. Left implicit, a route reads OutOfSync forever with
nothing to sync (argoproj/argo-cd#22151).
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  hostnames:
    - {{ required "host is required" .Values.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: 80
          weight: 1
