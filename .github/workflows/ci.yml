name: CI

on:
  push:
    # release.yml runs these checks on main.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      OPENAPI_BASE: ${{ github.workspace }}/.openapi-base/apps/server/api/openapi.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint and gitleaks read the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: 1.31.1
      - run: pipx install semgrep==1.185.0
      - run: pipx install sqlfluff==4.5.0
      - name: Install conftest
        run: |
          curl -sSfLo /tmp/conftest.tgz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  /tmp/conftest.tgz" | sha256sum -c
          sudo tar -xzf /tmp/conftest.tgz -C /usr/local/bin conftest
      - name: Install squawk
        run: |
          curl -sSfLo /tmp/squawk https://github.com/sbdchd/squawk/releases/download/v2.72.0/squawk-linux-x64
          echo "a61661808119a82515565503111099b070c869f73698f61cb1785de5d0c8b11a  /tmp/squawk" | sha256sum -c
          sudo install -m 755 /tmp/squawk /usr/local/bin/squawk
      - name: Install oasdiff
        run: |
          curl -sSfLo /tmp/oasdiff.tgz https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz
          echo "eac87307d31d08c36800c58a409c247f1c5db37fbb72e2544402f22a87cbca3c  /tmp/oasdiff.tgz" | sha256sum -c
          sudo tar -xzf /tmp/oasdiff.tgz -C /usr/local/bin oasdiff
      # The contract oasdiff compares api/openapi.yaml with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .openapi-base
          sparse-checkout: apps/server/api
          persist-credentials: false
      - name: Install hadolint
        run: |
          curl -sSfLo /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint" | sha256sum -c
          sudo install -m 755 /tmp/hadolint /usr/local/bin/hadolint
      - name: Install gitleaks
        run: |
          curl -sSfLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Commit headers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no commit before its push.
          case "$BASE" in '' | 0000*) BASE=$(git merge-base origin/main HEAD) ;; esac
          pnpm exec commitlint --from "$BASE" --to HEAD
      - run: gitleaks git --redact
      - run: hadolint apps/server/Dockerfile
      - run: docker build --check apps/server
      - run: pnpm --filter @savetab/extension exec playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest
      - run: pnpm test
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:e2e
      - run: pnpm test:e2e:firefox
      - name: Production builds hold no test hook
        run: pnpm build && ! grep -rq savetabTest apps/extension/.output/chrome-mv3 apps/extension/.output/firefox-mv3
